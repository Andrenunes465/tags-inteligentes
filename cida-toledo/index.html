<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Cida Toledo - Contato</title>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* FUNDO FIXO DA PÁGINA (Efeito Parallax com a foto da loja) */
    body { 
      background-image: url('foto de fundo.jpeg');
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-color: #D8C4B0; /* Cor de fallback caso a imagem não carregue */
      color: #FFFFFF; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 40px 20px; 
    }

    /* Camada de escurecimento suave para dar contraste */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(40, 20, 10, 0.55);
      z-index: 1;
    }

    /* CARTÃO MARROM COM EFEITO VIDRO FOSCO (GLASSMORPHISM) */
    .card { 
      position: relative;
      z-index: 2;
      background: rgba(108, 62, 36, 0.75); /* Marrom #6C3E24 com transparência */
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      width: 100%; 
      max-width: 380px; 
      padding: 30px 20px; 
      border-radius: 24px; 
      text-align: center; 
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
      border: 1px solid rgba(229, 209, 184, 0.4); /* Borda bege suave */
    }

    /* CONTÊINER DA LOGO */
    .logo-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      margin: 10px auto 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    /* IMAGEM DA LOGO - ENCAIXE EXATO */
    .avatar { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      object-position: center 38%; /* Ajusta o alinhamento vertical para focar perfeitamente no círculo CT */
      transform: scale(1.85);      /* Expande o suficiente para remover toda a sobra escura externa */
    }

    /* TÍTULO PRINCIPAL */
    h1 { 
      font-size: 1.4rem; 
      margin-top: 10px;
      margin-bottom: 8px; 
      color: #FFFFFF; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.6); 
    }

    /* BIO: TEXTO DE APRESENTAÇÃO */
    p.bio { 
      font-size: 0.9rem; 
      color: #F3E8DC; 
      margin-bottom: 24px; 
      line-height: 1.4; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.6); 
    }

    .links-container { display: flex; flex-direction: column; gap: 12px; }

    .btn { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 14px; 
      border-radius: 12px; 
      color: #fff; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 0.95rem; 
      transition: transform 0.1s ease; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .btn:active { transform: scale(0.98); }

    /* CORES DOS BOTÕES */
    .btn-whats { background-color: #25D366; }
    .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-maps { background-color: #ea4335; }
    .btn-pix { background-color: #00bdae; cursor: pointer; border: none; width: 100%; }

    .footer { margin-top: 25px; font-size: 0.75rem; color: #E2C9B4; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Contêiner que garante o recorte circular perfeito -->
    <div class="logo-wrapper">
      <img class="avatar" src="Logo.png" alt="Logo Loja Cida Toledo">
    </div>

    <h1>Loja Cida Toledo</h1>
    <p class="bio">Na Cida Toledo Moda Feminina, você encontra estilo, elegância e peças que valorizam a sua beleza. Venha nos fazer uma visita e descubra as novidades da nossa loja!</p>

    <div class="links-container">
      <a class="btn btn-whats" href="https://wa.me/5562983231545?text=Ol%C3%A1,%20gostaria%20de%20um%20atendimento!" target="_blank">
        💬 Falar no WhatsApp
      </a>

      <a class="btn btn-insta" href="https://instagram.com/lojacidatoledo" target="_blank">
        📸 Seguir no Instagram
      </a>

      <a class="btn btn-maps" href="https://maps.app.goo.gl/GtuDYUM1zVaT72L49" target="_blank">
        📍 Como Chegar (Localização)
      </a>

      <button class="btn btn-pix" onclick="copiarPix('62993501545')">
        💳 Copiar Chave PIX
      </button>
    </div>

  <script>
    function copiarPix(chave) {
      navigator.clipboard.writeText(chave).then(() => {
        alert('Chave PIX copiada com sucesso: ' + chave);
      });
    }
  </script>

</body>
</html>
