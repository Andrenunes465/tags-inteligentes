<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Dinalva</title>
  <!-- Ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* Perfil */
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2563eb;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .profile-location {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Botão Principal: Salvar na Agenda */
    .btn-main {
      background-color: #2563eb;
      color: #ffffff;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    /* Lista de Cartões de Informação */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      text-decoration: none;
      color: #1e293b;
    }

    .info-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .info-left i {
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .info-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .info-details label {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-details span {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }

    .btn-action {
      background-color: #e2e8f0;
      border: none;
      color: #334155;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .btn-whatsapp-bg {
      background-color: #22c55e;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Foto e Nome -->
    <img src="foto.jpg" alt="Foto de Perfil" class="profile-img">
    <h1 class="profile-name">Maria Dinalva</h1>
    <p class="profile-location">
      <i class="fa-solid fa-location-dot" style="color: #ef4444;"></i> Anápolis - GO
    </p>

    <!-- Botão de Destaque: Adicionar Contato -->
    <a href="contato.vcf" class="btn-main" download>
      <i class="fa-solid fa-user-plus"></i> Salvar na Agenda
    </a>

    <!-- Bloco de Informações Práticas -->
    <div class="info-list">
      
      <!-- WhatsApp -->
      <a href="https://wa.me/5562999999999?text=Olá!" target="_blank" class="info-card">
        <div class="info-left">
          <i class="fa-brands fa-whatsapp" style="color: #22c55e;"></i>
          <div class="info-details">
            <label>WhatsApp</label>
            <span>(62) 99170-6923</span>
          </div>
        </div>
        <span class="btn-action btn-whatsapp-bg">Mandar Mensagem</span>
      </a>

      <!-- E-mail -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-regular fa-envelope" style="color: #2563eb;"></i>
          <div class="info-details">
            <label>E-mail</label>
            <span id="email-text">mariadinalva22@gmail.com</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('email-text', 'E-mail')">Copiar</button>
      </div>

      <!-- CPF -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-solid fa-id-card" style="color: #475569;"></i>
          <div class="info-details">
            <label>CPF</label>
            <span id="cpf-text">165.603.961-34</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('cpf-text', 'CPF')">Copiar</button>
      </div>

      <!-- Chave PIX -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-solid fa-pix" style="color: #00bdae;"></i>
          <div class="info-details">
            <label>Chave Pix</label>
            <span id="pix-key">62991706923</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('pix-key', 'Chave PIX')">Copiar</button>
      </div>

      <!-- Instagram / Rede Social (Opcional) -->
      <a href="https://instagram.com/usuario" target="_blank" class="info-card">
        <div class="info-left">
          <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
          <div class="info-details">
            <label>Instagram</label>
            <span>@usuario</span>
          </div>
        </div>
        <span class="btn-action">Ver Perfil</span>
      </a>

    </div>
  </div>

  <script>
    function copiarTexto(idElemento, nomeCampo) {
      const texto = document.getElementById(idElemento).innerText;
      navigator.clipboard.writeText(texto).then(() => {
        alert(nomeCampo + ' copiado para a área de transferência!');
      });
    }
  </script>

</body>
</html>
