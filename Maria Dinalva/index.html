<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Dinalva - Cartão Digital</title>
  <!-- Ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Tela de fundo: Nude mais escurinho / terroso suave */
    body {
      background: #D8C4B6;
      color: #3D312A;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Cartão Principal: Nude claro elegante (Linen / Warm Off-White) */
    .card-container {
      background-color: #FAF0E6;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 12px 32px rgba(61, 49, 42, 0.15);
      text-align: center;
      border: 1px solid #E5D3B3;
    }

    /* Perfil */
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #B88B7D;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(184, 139, 125, 0.25);
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3D312A;
      margin-bottom: 6px;
    }

    .profile-location {
      font-size: 0.95rem;
      color: #7D6356;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Lista de Cartões de Informação */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-card {
      background-color: #FFFDF9;
      border: 1px solid #EFE2D3;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      text-decoration: none;
      color: #3D312A;
      transition: transform 0.1s ease;
    }

    .info-card:active {
      transform: scale(0.99);
    }

    .info-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .info-left i {
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .info-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .info-details label {
      font-size: 0.72rem;
      color: #8C7063;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-details span {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
      color: #3D312A;
    }

    .btn-action {
      background-color: #A37367;
      border: none;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .btn-whatsapp-bg {
      background-color: #25D366;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Foto e Nome -->
    <img src="Foto.jpeg" alt="Foto de Perfil" class="profile-img">
    <h1 class="profile-name">Maria Dinalva</h1>
    <p class="profile-location">
      <i class="fa-solid fa-location-dot" style="color: #B88B7D;"></i> Anápolis - GO
    </p>

    <!-- Bloco de Informações Práticas -->
    <div class="info-list">
      
      <!-- 1. WhatsApp -->
      <a href="https://wa.me/5562991706923?text=Olá!" target="_blank" class="info-card">
        <div class="info-left">
          <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i>
          <div class="info-details">
            <label>WhatsApp</label>
            <span>(62) 99170-6923</span>
          </div>
        </div>
        <span class="btn-action btn-whatsapp-bg">Mandar Mensagem</span>
      </a>

      <!-- 2. E-mail -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-regular fa-envelope" style="color: #B88B7D;"></i>
          <div class="info-details">
            <label>E-mail</label>
            <span id="email-text">mariadinalva22@gmail.com</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('email-text', 'E-mail')">Copiar</button>
      </div>

      <!-- 3. CPF -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-solid fa-id-card" style="color: #8C7063;"></i>
          <div class="info-details">
            <label>CPF</label>
            <span id="cpf-text">165.603.961-34</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('cpf-text', 'CPF')">Copiar</button>
      </div>

      <!-- 4. Instagram  -->
      <a href="https://instagram.com/mariadinalva79" target="_blank" class="info-card">
        <div class="info-left">
          <i class="fa-brands fa-instagram" style="color: #E1306C;"></i>
          <div class="info-details">
            <label>Instagram</label>
            <span>@usuario</span>
          </div>
        </div>
        <span class="btn-action">Ver Perfil</span>
      </a>

      <!-- 5. Chave PIX  -->
      <div class="info-card">
        <div class="info-left">
          <i class="fa-solid fa-pix" style="color: #00BDAE;"></i>
          <div class="info-details">
            <label>Chave Pix</label>
            <span id="pix-key">62991706923</span>
          </div>
        </div>
        <button class="btn-action" onclick="copiarTexto('pix-key', 'Chave PIX')">Copiar</button>
      </div>

    </div>
  </div>

  <script>
    function copiarTexto(idElemento, nomeCampo) {
      const texto = document.getElementById(idElemento).innerText;
      navigator.clipboard.writeText(texto).then(() => {
        alert(nomeCampo + ' copiado para a área de transferência!');
      });
    }
  </script>

</body>
</html>
